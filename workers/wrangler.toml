# HGhub-Workers H5 渠道。静态资源与代理由同一个 Worker 提供，dist 来自根目录 `h5:build`。
# 部署命令见 docs/h5-channel.md；口令用 `wrangler secret put H5_ACCESS_KEY` 写入，不要写在此文件。
name = "hghub-workers-h5"
main = "src/index.ts"
compatibility_date = "2026-11-15"

# run_worker_first：所有请求先进 Worker，才能对 HTML 注入 CSP、对 /hg/* 做访问控制。
# 需要 wrangler 4.x（支持 Workers Assets + run_worker_first）。
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true

# 可选变量（非密钥，可按需启用）：
#   H5_ALLOWED_ORIGIN = "http://localhost:1420"   本地 vite dev 联调时额外放行的 Origin
#   H5_EXTRA_BASES    = "https://..."            额外可信上游 origin，逗号分隔，须为 HTTPS 根地址
[vars]
